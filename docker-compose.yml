services:
  postgres:
    image: postgres:16-alpine
    container_name: smartadvisor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-smartadvisor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-advisor_secret_pass}
      POSTGRES_DB: ${DB_NAME:-smartadvisor_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smartadvisor} -d ${DB_NAME:-smartadvisor_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
