services:
  postgres:
    image: postgres:16-alpine
    container_name: smartadvisor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartadvisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartadvisor_secret}
      POSTGRES_DB: ${POSTGRES_DB:-smartadvisor_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartadvisor} -d ${POSTGRES_DB:-smartadvisor_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: smartadvisor_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: smartadvisor_api
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-smartadvisor}:${POSTGRES_PASSWORD:-smartadvisor_secret}@postgres:5432/${POSTGRES_DB:-smartadvisor_db}
      REDIS_URL: redis://redis:6379
      DATA_PATH: /data/response.json
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: smartadvisor_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: smartadvisor_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
